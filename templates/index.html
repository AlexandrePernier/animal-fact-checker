<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Fact Checker</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>

    <!-- BOUTON LANGUE -->
    <button id="lang-btn" title="Switch language">🇫🇷</button>

    <!-- USERNAME SCREEN (premier lancement) -->
    <div id="username-screen">
        <h1 data-i18n="ui.title">🦁 Animal Fact Checker</h1>
        <p data-i18n="ui.enter_name">Enter your name:</p>
        <input type="text" id="username-input" maxlength="20" autocomplete="off" />
        <button id="username-confirm-btn" data-i18n="ui.confirm">Confirm</button>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="hidden">
        <h1 data-i18n="ui.title">🦁 Animal Fact Checker</h1>
        <p id="welcome-msg"></p>
        <button id="start-btn" data-i18n="ui.start">Start Game</button>
        <button id="leaderboard-btn" data-i18n="ui.leaderboard">Leaderboard</button>
        <button id="change-username-btn" data-i18n="ui.change_username">Change name</button>
    </div>

    <!-- GAME -->
    <div class="game-container hidden" id="game">
        <h1 class="title" data-i18n="ui.title">🦁 Animal Fact Checker</h1>

        <div class="card" id="card">
            <img id="animal-img" src="" alt="">
            <p id="question">Loading...</p>
        </div>

        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <div class="buttons">
            <button id="trueBtn" class="btn true" data-i18n="ui.true">TRUE</button>
            <button id="falseBtn" class="btn false" data-i18n="ui.false">FALSE</button>
        </div>

        <p id="result"></p>

        <div class="score-box">
            <p id="score">Score: 0</p>
            <p id="streak">🔥 Streak: 0</p>
            <p id="lives">❤️❤️❤️</p>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over" class="hidden">
        <h2 data-i18n="ui.game_over">💀 Game Over</h2>
        <p id="final-score"></p>
        <button id="restart-btn" class="btn" data-i18n="ui.restart">Restart</button>
        <button id="view-leaderboard-btn" class="btn" data-i18n="ui.view_leaderboard">View Leaderboard</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard-screen" class="hidden">
        <h2 data-i18n="ui.leaderboard_title">🏆 Leaderboard</h2>
        <div id="leaderboard-list" class="leaderboard"></div>
        <button id="back-btn" class="btn" data-i18n="ui.back">Back</button>
    </div>

    <script type="module" src="/static/js/main.js"></script>

</body>

</html>
